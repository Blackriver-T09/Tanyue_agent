[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-g1-emote-loop"
version = "0.1.0"
description = "Local agent loop for Unitree G1 and LinkerHand abstract emotes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.2.0"]

[tool.setuptools.packages.find]
include = ["loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
