<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanyue Voice Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1d2430;
        --muted: #687385;
        --border: #dce1e8;
        --accent: #1868db;
        --accent-dark: #0f4da5;
        --ok: #0f8a5f;
        --warn: #a06100;
        --error: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .topbar {
        position: fixed;
        inset: 0 0 auto;
        z-index: 10;
        height: 58px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(247, 248, 250, 0.94);
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 720;
        letter-spacing: 0;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status {
        min-width: 112px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      .status.connected {
        color: var(--ok);
      }
      .status.error {
        color: var(--error);
      }
      .shell {
        height: 100vh;
        padding-top: 58px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        transition: grid-template-columns 180ms ease;
      }
      body.debug-collapsed .shell {
        grid-template-columns: minmax(0, 1fr) 46px;
      }
      .avatar-stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #f5f4f0;
      }
      .avatar-stage iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: #f5f4f0;
      }
      .debug-panel {
        min-width: 0;
        height: calc(100vh - 58px);
        border-left: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .debug-panel-header {
        height: 48px;
        padding: 0 12px 0 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .debug-panel-title {
        min-width: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }
      .debug-toggle {
        width: 30px;
        min-width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 6px;
      }
      body.debug-collapsed .debug-panel {
        align-items: stretch;
      }
      body.debug-collapsed .debug-panel-header {
        height: 100%;
        padding: 8px;
        writing-mode: vertical-rl;
      }
      body.debug-collapsed .debug-panel-title,
      body.debug-collapsed .debug-content {
        display: none;
      }
      body.debug-collapsed .debug-toggle {
        writing-mode: horizontal-tb;
      }
      .debug-content {
        min-height: 0;
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }
      .controls {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        max-height: 44vh;
        overflow: auto;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 650;
      }
      input,
      select {
        width: 100%;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        background: #fff;
      }
      .field {
        margin-bottom: 14px;
      }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        height: 38px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-dark);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .log-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .call-state {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
      }
      .call-state strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }
      .call-state span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .call-state.mic-paused {
        border-color: rgba(160, 97, 0, 0.35);
        background: #fff8eb;
      }
      .meter {
        height: 8px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6ebf2;
      }
      .meter > div {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--ok);
        transition: width 90ms linear;
      }
      #log {
        min-height: 0;
        flex: 1;
        padding: 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
        line-height: 1.55;
      }
      .entry {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f3f6fa;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .entry.error {
        color: var(--error);
        background: #fff0ed;
      }
      .entry.system {
        color: var(--muted);
      }
      .entry.user {
        background: #eaf2ff;
      }
      .entry.agent {
        background: #f0fbf6;
      }
      audio {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      @media (max-width: 820px) {
        body {
          overflow: auto;
        }
        .topbar {
          position: sticky;
        }
        .shell {
          height: auto;
          min-height: calc(100vh - 58px);
          grid-template-columns: 1fr;
        }
        body.debug-collapsed .shell {
          grid-template-columns: 1fr;
        }
        .avatar-stage {
          height: 58vh;
        }
        .debug-panel {
          height: auto;
          min-height: 42vh;
          border-left: 0;
          border-top: 1px solid var(--border);
        }
        body.debug-collapsed .debug-panel {
          min-height: 48px;
        }
        body.debug-collapsed .debug-panel-header {
          height: 48px;
          writing-mode: horizontal-tb;
        }
        .status {
          min-width: 96px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
        <h1>Tanyue Voice Agent</h1>
        <div class="topbar-actions">
          <div id="status" class="status">idle</div>
        </div>
    </header>

    <main class="shell">
      <section class="avatar-stage" aria-label="Tanyue character">
        <iframe
          id="characterFrame"
          title="Tanyue Character"
          src="/character/?embed=1&bridge=http://127.0.0.1:8893"
          allow="autoplay; microphone"
        ></iframe>
      </section>

      <aside class="debug-panel" aria-label="Voice debug panel">
        <div class="debug-panel-header">
          <span class="debug-panel-title">Voice Debug</span>
          <button id="toggleDebug" class="debug-toggle" type="button" title="Toggle debug panel">›</button>
        </div>
        <div class="debug-content">
          <div class="controls">
            <div class="field">
              <label for="room">Room</label>
              <input id="room" value="tanyue-room" />
            </div>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" value="user" />
            </div>
            <div class="buttons">
              <button id="connect" class="primary">Connect</button>
              <button id="disconnect" disabled>Disconnect</button>
            </div>
            <div class="field" style="margin-top: 14px;">
              <label><input id="playLocalAudio" type="checkbox" checked /> 本机播放音频</label>
              <label><input id="playRobotAudio" type="checkbox" /> 机器人播放音频</label>
            </div>
            <p class="hint">
              Connect 会请求麦克风权限并加入 LiveKit 房间。Agent 后台请另开终端运行
              <code>python tanyue_agent.py start</code>。每轮语音会先识别梗，再交给在线 LLM 接梗回复。
            </p>
            <div class="call-state">
              <strong id="callStateTitle">Not connected</strong>
              <span id="callStateText">连接后直接对着麦克风说话。</span>
              <span id="playbackHint">本机播放开启。机器人播放关闭。</span>
              <div class="meter" aria-label="microphone level"><div id="micLevel"></div></div>
            </div>
          </div>

          <div class="log-header">
            <span>Session log</span>
            <span id="identity"></span>
          </div>
          <div id="log"></div>
          <audio id="remoteAudio" autoplay preload="auto"></audio>
        </div>
      </aside>
    </main>

    <script type="module">
      import {
        Room,
        RoomEvent,
        createLocalAudioTrack
      } from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";

      const statusEl = document.querySelector("#status");
      const logEl = document.querySelector("#log");
      const connectBtn = document.querySelector("#connect");
      const disconnectBtn = document.querySelector("#disconnect");
      const identityEl = document.querySelector("#identity");
      const audioEl = document.querySelector("#remoteAudio");
      const roomInput = document.querySelector("#room");
      const nameInput = document.querySelector("#name");
      const callStateTitle = document.querySelector("#callStateTitle");
      const callStateText = document.querySelector("#callStateText");
      const playbackHintEl = document.querySelector("#playbackHint");
      const micLevelEl = document.querySelector("#micLevel");
      const toggleDebugBtn = document.querySelector("#toggleDebug");
      const playLocalAudioEl = document.querySelector("#playLocalAudio");
      const playRobotAudioEl = document.querySelector("#playRobotAudio");

      let room = null;
      let micTrack = null;
      let audioContext = null;
      let meterTimer = null;
      let statusTimer = null;
      let micResumeTimer = null;
      let micSafetyResumeTimer = null;
      let micPausedByAssistant = false;
      let lastStatusLine = "";
      let lastTranscriptKey = "";
      let localPlaybackEnabled = true;
      let robotPlaybackEnabled = false;
      let waitingForAssistantResponse = false;
      let assistantAudioSpeaking = false;
      let robotPlaybackInProgress = false;
      let latestAssistantVoiceKey = "";
      let latestAssistantVoiceId = "";
      let lastRobotPlaybackKey = "";

      function loadPlaybackPreferences() {
        const storedLocal = window.localStorage.getItem("tanyue.localPlaybackEnabled");
        const storedRobot = window.localStorage.getItem("tanyue.robotPlaybackEnabled");
        if (storedLocal != null) {
          localPlaybackEnabled = storedLocal !== "0";
          playLocalAudioEl.checked = localPlaybackEnabled;
        }
        if (storedRobot != null) {
          robotPlaybackEnabled = storedRobot === "1";
          playRobotAudioEl.checked = robotPlaybackEnabled;
        }
      }

      function setStatus(text, className = "") {
        statusEl.textContent = text;
        statusEl.className = `status ${className}`.trim();
      }

      function log(message, kind = "system") {
        const node = document.createElement("div");
        node.className = `entry ${kind}`.trim();
        node.textContent = message;
        logEl.appendChild(node);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setCallState(title, text) {
        callStateTitle.textContent = title;
        callStateText.textContent = text;
      }

      function updatePlaybackHint() {
        const localText = localPlaybackEnabled ? "本机播放开启" : "本机播放关闭";
        const robotText = robotPlaybackEnabled ? "机器人播放已选中" : "机器人播放关闭";
        const caution = robotPlaybackEnabled
          ? "收到最终回复后会额外尝试触发机器人播报。"
          : "";
        playbackHintEl.textContent = `${localText}。${robotText}。${caution}`;
        if (audioEl) {
          audioEl.muted = !localPlaybackEnabled;
          audioEl.volume = localPlaybackEnabled ? 1 : 0;
          audioEl.autoplay = true;
          audioEl.playsInline = true;
        }
        window.localStorage.setItem("tanyue.localPlaybackEnabled", localPlaybackEnabled ? "1" : "0");
        window.localStorage.setItem("tanyue.robotPlaybackEnabled", robotPlaybackEnabled ? "1" : "0");
        window.dispatchEvent(
          new CustomEvent("tanyue:playback-settings", {
            detail: {
              localPlaybackEnabled,
              robotPlaybackEnabled,
            },
          }),
        );
      }

      async function setMicInputPaused(paused, reason = "") {
        if (!micTrack) return;
        if (!paused && shouldHoldMicInput()) {
          setCallState("Input paused", micPauseReason());
          return;
        }
        if (paused === micPausedByAssistant) return;
        micPausedByAssistant = paused;
        const stateBox = callStateTitle.closest(".call-state");
        stateBox?.classList.toggle("mic-paused", paused);

        try {
          if (paused) {
            if (typeof micTrack.mute === "function") {
              await micTrack.mute();
            } else if (micTrack.mediaStreamTrack) {
              micTrack.mediaStreamTrack.enabled = false;
            }
            setCallState("Assistant speaking", reason || "Agent 正在说话，已暂时暂停麦克风输入。");
          } else {
            if (typeof micTrack.unmute === "function") {
              await micTrack.unmute();
            } else if (micTrack.mediaStreamTrack) {
              micTrack.mediaStreamTrack.enabled = true;
            }
            setCallState("Listening", "麦克风已恢复。请直接说话，说完后等待回复。");
          }
        } catch (err) {
          log(err instanceof Error ? err.message : String(err), "error");
        }
      }

      function scheduleMicResume(delayMs = 700) {
        if (micResumeTimer) window.clearTimeout(micResumeTimer);
        micResumeTimer = window.setTimeout(() => {
          releaseMicInputIfReady();
        }, delayMs);
      }

      function shouldHoldMicInput() {
        return waitingForAssistantResponse || assistantAudioSpeaking || robotPlaybackInProgress;
      }

      function micPauseReason() {
        if (robotPlaybackInProgress) return "机器人正在播报，已暂停麦克风输入。";
        if (assistantAudioSpeaking) return "Agent 正在说话，已暂停麦克风输入。";
        if (waitingForAssistantResponse) return "已收到你的话，正在等待回复，麦克风暂时静音。";
        return "麦克风暂时静音。";
      }

      function releaseMicInputIfReady() {
        if (shouldHoldMicInput()) {
          setCallState("Input paused", micPauseReason());
          return;
        }
        setMicInputPaused(false).catch((err) => {
          log(err instanceof Error ? err.message : String(err), "error");
        });
      }

      function handleControlMessage(text) {
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          return false;
        }
        if (data?.type !== "assistant_speaking") return false;
        if (data.voiceKey) latestAssistantVoiceKey = data.voiceKey;
        if (data.voiceId) latestAssistantVoiceId = data.voiceId;
        if (data.speaking) {
          assistantAudioSpeaking = true;
          waitingForAssistantResponse = false;
          if (micResumeTimer) window.clearTimeout(micResumeTimer);
          if (micSafetyResumeTimer) window.clearTimeout(micSafetyResumeTimer);
          setMicInputPaused(true, "Agent 正在生成语音，已暂停麦克风输入。").catch((err) => {
            log(err instanceof Error ? err.message : String(err), "error");
          });
          if (data.replyText) {
            relayAssistantToRobot(data.replyText, {
              voiceKey: data.voiceKey || latestAssistantVoiceKey,
              voiceId: data.voiceId || latestAssistantVoiceId,
            });
          }
          micSafetyResumeTimer = window.setTimeout(() => {
            assistantAudioSpeaking = false;
            waitingForAssistantResponse = false;
            releaseMicInputIfReady();
          }, 30000);
        } else {
          assistantAudioSpeaking = false;
          if (micSafetyResumeTimer) {
            window.clearTimeout(micSafetyResumeTimer);
            micSafetyResumeTimer = null;
          }
          scheduleMicResume(650);
        }
        return true;
      }

      function participantName(participant) {
        return participant?.name || participant?.identity || "participant";
      }

      function transcriptKey(text) {
        return String(text || "")
          .toLowerCase()
          .replace(/\s+/g, "")
          .replace(/[。！？!?.,，；;:："'`~·、()（）【】\[\]{}<>]/g, "");
      }

      function logTranscript(text, participant, final = false) {
        const name = participantName(participant);
        const isUser = room && participant?.identity === room.localParticipant.identity;
        const kind = isUser ? "user" : "agent";
        const key = `${participant?.identity || kind}:${transcriptKey(text)}`;
        if (final && key === lastTranscriptKey) return;
        if (final) lastTranscriptKey = key;
        log(`${isUser ? "你" : name}${final ? "" : " ..."}\n${text}`, kind);
      }

      async function relayAssistantToRobot(text, options = {}) {
        if (!robotPlaybackEnabled) return;
        const content = String(text || "").trim();
        if (!content) return;
        const voiceKey = options.voiceKey || latestAssistantVoiceKey || "";
        const voiceId = options.voiceId || latestAssistantVoiceId || "";
        const playbackKey = `${transcriptKey(content)}:${voiceKey || voiceId || "default"}`;
        if (playbackKey === lastRobotPlaybackKey) return;
        lastRobotPlaybackKey = playbackKey;
        robotPlaybackInProgress = true;
        if (micResumeTimer) window.clearTimeout(micResumeTimer);
        await setMicInputPaused(true, "机器人正在播报，已暂停麦克风输入。");
        try {
          const res = await fetch("/api/robot-playback", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              text: content,
              room: roomInput.value.trim() || "tanyue-room",
              voice_key: voiceKey,
              voice_id: voiceId,
            }),
          });
          if (!res.ok) {
            throw new Error(await res.text());
          }
          const data = await res.json();
          if (data.status !== "ok") {
            const stage = data.stage ? ` ${data.stage}` : "";
            log(`robot playback ${data.status}${stage}: ${data.reason || "unknown"}`, "error");
            return;
          }
          log(
            `robot playback ok: interface=${data.interface || "-"} volume=${data.volume ?? "-"} voice=${data.voice || "-"}`
          );
        } catch (err) {
          log(err instanceof Error ? err.message : String(err), "error");
        } finally {
          robotPlaybackInProgress = false;
          scheduleMicResume(350);
        }
      }

      async function dispatchAgent(roomName) {
        const params = new URLSearchParams({ room: roomName });
        const res = await fetch(`/api/dispatch-agent?${params}`, {
          method: "POST"
        });
        if (!res.ok) {
          throw new Error(`agent dispatch failed: ${await res.text()}`);
        }
        const data = await res.json();
        log(`agent ${data.status}: ${data.agent_name} (${data.dispatch_id || "no id"}) · meme_play`);
      }

      async function checkLiveKitStatus(roomName, verbose = false) {
        const res = await fetch(`/api/livekit-status?room=${encodeURIComponent(roomName)}`);
        if (!res.ok) {
          throw new Error(`livekit status failed: ${await res.text()}`);
        }
        const status = await res.json();
        const participants = status.participants || [];
        const dispatches = status.dispatches || [];
        const identities = participants.map((item) => item.identity).filter(Boolean);
        const hasAgent = identities.some((id) => id !== room?.localParticipant?.identity);
        const dispatchLabel = dispatches.map((item) => {
          return `${item.agent_name || "agent"}:${item.state}`;
        }).join(", ") || "none";
        const statusLine = `participants: ${identities.join(", ") || "none"}\ndispatches: ${dispatchLabel}`;

        if (hasAgent && !micPausedByAssistant && !shouldHoldMicInput()) {
          setCallState("Listening", `Agent 已加入。请直接说话，麦克风电平跳动时表示浏览器正在采集声音。`);
        } else if (!hasAgent) {
          setCallState("Waiting for agent", `已请求 Agent，但房间里暂时只有你。dispatch=${dispatchLabel}`);
        }

        if (verbose || statusLine !== lastStatusLine) {
          log(`room status\n${statusLine}`);
          lastStatusLine = statusLine;
        }
        return status;
      }

      function startStatusPolling(roomName) {
        stopStatusPolling();
        statusTimer = window.setInterval(() => {
          checkLiveKitStatus(roomName).catch((err) => {
            log(err instanceof Error ? err.message : String(err), "error");
          });
        }, 2500);
      }

      function stopStatusPolling() {
        if (statusTimer) {
          window.clearInterval(statusTimer);
          statusTimer = null;
        }
      }

      function startMicMeter(mediaStream) {
        stopMicMeter();
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(mediaStream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const data = new Uint8Array(analyser.fftSize);
        meterTimer = window.setInterval(() => {
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (const value of data) {
            const centered = value - 128;
            sum += centered * centered;
          }
          const rms = Math.sqrt(sum / data.length) / 128;
          micLevelEl.style.width = `${Math.min(100, Math.round(rms * 220))}%`;
        }, 100);
      }

      function stopMicMeter() {
        if (meterTimer) {
          window.clearInterval(meterTimer);
          meterTimer = null;
        }
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        micLevelEl.style.width = "0%";
      }

      async function connect() {
        try {
          setStatus("connecting");
          connectBtn.disabled = true;
          const params = new URLSearchParams({
            room: roomInput.value.trim() || "tanyue-room",
            name: nameInput.value.trim() || "user"
          });
          const roomName = params.get("room");
          const res = await fetch(`/api/livekit-token?${params}`);
          if (!res.ok) {
            throw new Error(await res.text());
          }
          const data = await res.json();

          room = new Room({
            adaptiveStream: true,
            dynacast: true
          });

          room.on(RoomEvent.TrackSubscribed, (track) => {
            if (track.kind === "audio") {
              track.attach(audioEl);
              audioEl.load();
              audioEl.play().catch((err) => {
                log(err instanceof Error ? err.message : String(err), "error");
              });
              log("assistant audio subscribed");
            }
          });

          room.on(RoomEvent.TrackUnsubscribed, (track) => {
            if (track.kind === "audio") {
              log("assistant audio unsubscribed");
            }
          });

          room.on(RoomEvent.ParticipantConnected, (participant) => {
            log(`${participantName(participant)} joined`);
          });

          room.on(RoomEvent.ParticipantDisconnected, (participant) => {
            log(`${participantName(participant)} left`);
          });

          room.on(RoomEvent.Disconnected, () => {
            setStatus("disconnected");
            setCallState("Not connected", "连接后直接对着麦克风说话。");
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            identityEl.textContent = "";
            log("disconnected");
          });

          room.on(RoomEvent.DataReceived, (payload, participant) => {
            const text = new TextDecoder().decode(payload);
            if (handleControlMessage(text)) return;
            log(`${participant?.identity || "data"}: ${text}`);
          });

          if (RoomEvent.TranscriptionReceived) {
            room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
              for (const segment of segments) {
                const text = segment.text || "";
                const isFinal = segment.final || segment.isFinal;
                if (text && isFinal) {
                  logTranscript(text, participant, true);
                  if (participant && participant.identity === room.localParticipant.identity) {
                    waitingForAssistantResponse = true;
                    if (micResumeTimer) window.clearTimeout(micResumeTimer);
                    setMicInputPaused(true, "已收到你的话，正在等待回复，麦克风暂时静音。").catch((err) => {
                      log(err instanceof Error ? err.message : String(err), "error");
                    });
                  } else {
                    waitingForAssistantResponse = false;
                    relayAssistantToRobot(text);
                  }
                }
              }
            });
          }

          await room.connect(data.url, data.token);
          updatePlaybackHint();
          micTrack = await createLocalAudioTrack({
            echoCancellation: { ideal: true },
            noiseSuppression: { ideal: true },
            autoGainControl: { ideal: true },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            advanced: [
              {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              }
            ]
          });
          await room.localParticipant.publishTrack(micTrack);
          const mediaStream = new MediaStream([micTrack.mediaStreamTrack]);
          startMicMeter(mediaStream);
          await setMicInputPaused(false);
          await dispatchAgent(roomName);
          await checkLiveKitStatus(roomName, true);
          startStatusPolling(roomName);

          setStatus("connected", "connected");
          disconnectBtn.disabled = false;
          identityEl.textContent = data.identity;
          log(`connected to ${data.room}`);
        } catch (err) {
          setStatus("error", "error");
          connectBtn.disabled = false;
          log(err instanceof Error ? err.message : String(err), "error");
        }
      }

      async function disconnect() {
        if (micTrack) {
          await setMicInputPaused(false);
          micTrack.stop();
          micTrack = null;
        }
        stopMicMeter();
        if (micSafetyResumeTimer) {
          window.clearTimeout(micSafetyResumeTimer);
          micSafetyResumeTimer = null;
        }
        stopStatusPolling();
        if (room) {
          room.disconnect();
          room = null;
        }
      }

      connectBtn.addEventListener("click", connect);
      disconnectBtn.addEventListener("click", disconnect);
      playLocalAudioEl.addEventListener("change", () => {
        localPlaybackEnabled = playLocalAudioEl.checked;
        updatePlaybackHint();
      });
      playRobotAudioEl.addEventListener("change", () => {
        robotPlaybackEnabled = playRobotAudioEl.checked;
        updatePlaybackHint();
      });
      toggleDebugBtn.addEventListener("click", () => {
        document.body.classList.toggle("debug-collapsed");
        const collapsed = document.body.classList.contains("debug-collapsed");
        toggleDebugBtn.textContent = collapsed ? "‹" : "›";
        toggleDebugBtn.title = collapsed ? "Open debug panel" : "Close debug panel";
      });
      loadPlaybackPreferences();
      updatePlaybackHint();
      log("ready · meme_play");
    </script>
  </body>
</html>
